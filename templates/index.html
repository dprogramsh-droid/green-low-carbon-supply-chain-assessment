<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绿色低碳供应链评估系统</title>
<style>
:root{--c1:#059669;--c1l:#10b981;--c1d:#047857;--c1bg:#ecfdf5;--sf:#fff;--bg:#f1f5f9;--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;--bd:#e2e8f0;--bd2:#cbd5e1;--r:10px;--rl:14px;--sh:0 1px 3px rgba(0,0,0,.06);--shm:0 4px 12px rgba(0,0,0,.08);--dg:#dc2626;--wn:#d97706;--in:#2563eb;--ok:#16a34a;--sw:220px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;font-size:14px}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:linear-gradient(180deg,#064e3b,#065f46);color:#fff;display:flex;flex-direction:column;z-index:50}
.sb-brand{padding:1rem 1rem .6rem;border-bottom:1px solid rgba(255,255,255,.12)}
.sb-brand h1{font-size:.95rem;font-weight:700;line-height:1.4}.sb-brand p{font-size:.68rem;opacity:.5;margin-top:.1rem}
.sb-nav{flex:1;padding:.5rem .4rem;overflow-y:auto}
.sb-sec{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.35);padding:.7rem .7rem .25rem;font-weight:600}
.ni{display:flex;align-items:center;gap:.55rem;padding:.5rem .7rem;border-radius:7px;cursor:pointer;font-size:.82rem;font-weight:500;color:rgba(255,255,255,.7);transition:all .15s;margin-bottom:1px}
.ni:hover{background:rgba(255,255,255,.1);color:#fff}.ni.on{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.ni svg{width:17px;height:17px;flex-shrink:0;opacity:.65}.ni.on svg{opacity:1}
.ni .nb{margin-left:auto;background:rgba(255,255,255,.2);padding:.08rem .4rem;border-radius:99px;font-size:.68rem;font-weight:600}
.main{margin-left:var(--sw);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:52px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;position:sticky;top:0;z-index:40}
.topbar-t{font-size:1rem;font-weight:600}.ct{flex:1;padding:1.25rem 1.5rem}
.page{display:none}.page.on{display:block}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);box-shadow:var(--sh);padding:1.2rem;margin-bottom:.85rem}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem}
.card-t{font-size:.95rem;font-weight:600;display:flex;align-items:center;gap:.45rem}
.st{font-size:1.1rem;font-weight:700;margin-bottom:.85rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.65rem;margin-bottom:1.1rem}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.85rem 1rem;text-align:center}
.stat b{font-size:1.6rem;font-weight:800;color:var(--c1);display:block}.stat small{font-size:.75rem;color:var(--tx2)}
.btn{display:inline-flex;align-items:center;gap:.3rem;padding:.4rem .8rem;border-radius:7px;border:none;font-size:.8rem;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit}
.bp{background:var(--c1);color:#fff}.bp:hover{background:var(--c1d)}
.bo{background:transparent;color:var(--c1);border:1px solid var(--c1)}.bo:hover{background:var(--c1bg)}
.bg{background:transparent;color:var(--tx2);border:1px solid var(--bd)}.bg:hover{background:var(--bg)}
.bd{background:transparent;color:var(--dg);border:1px solid #fecaca}.bd:hover{background:#fef2f2}
.bs{padding:.28rem .55rem;font-size:.75rem}.bl{padding:.55rem 1.1rem;font-size:.88rem}
.fg{margin-bottom:.75rem}.fg label{display:block;font-weight:500;font-size:.8rem;margin-bottom:.25rem}
.fg input,.fg select,.fg textarea{width:100%;padding:.45rem .65rem;border:1px solid var(--bd);border-radius:7px;font-size:.84rem;font-family:inherit;background:var(--sf);transition:border .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--c1);box-shadow:0 0 0 3px rgba(5,150,105,.1)}
.fg textarea{resize:vertical;min-height:65px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:640px){.fr{grid-template-columns:1fr}}
.tw{overflow-x:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:.6rem .7rem;text-align:left;border-bottom:1px solid var(--bd)}
th{font-weight:600;color:var(--tx2);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;background:var(--bg)}
tbody tr:hover td{background:#f8fafb}
.badge{display:inline-block;padding:.13rem .5rem;border-radius:99px;font-size:.7rem;font-weight:600;white-space:nowrap}
.bg-g{background:#dcfce7;color:#166534}.bg-b{background:#dbeafe;color:#1e40af}.bg-a{background:#fef3c7;color:#92400e}.bg-r{background:#fee2e2;color:#991b1b}.bg-p{background:#ede9fe;color:#5b21b6}.bg-y{background:#f1f5f9;color:#475569}.bg-t{background:#ccfbf1;color:#134e4a}
.ct-tabs{display:flex;gap:.25rem;flex-wrap:wrap;margin-bottom:.75rem}
.ct-tab{padding:.28rem .7rem;border-radius:99px;border:1px solid var(--bd);background:var(--sf);cursor:pointer;font-size:.76rem;font-weight:500;transition:all .15s}
.ct-tab:hover{border-color:var(--c1);color:var(--c1)}.ct-tab.on{background:var(--c1);color:#fff;border-color:var(--c1)}
.wf{display:flex;align-items:center;gap:0;margin-bottom:1.25rem;justify-content:center;flex-wrap:wrap}
.ws{display:flex;align-items:center;gap:.35rem;padding:.5rem .85rem;border-radius:99px;font-size:.8rem;font-weight:500;color:var(--tx3);background:var(--sf);border:2px solid var(--bd);transition:all .2s}
.ws .wn{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;background:var(--bd);color:var(--tx3);flex-shrink:0}
.ws.wact{color:var(--c1);border-color:var(--c1);background:var(--c1bg)}.ws.wact .wn{background:var(--c1);color:#fff}
.ws.wdn{color:var(--c1);border-color:var(--c1l);background:var(--c1bg)}.ws.wdn .wn{background:var(--c1);color:#fff}
.wl{width:28px;height:2px;background:var(--bd);flex-shrink:0}.wl.wdn{background:var(--c1)}
.scg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.85rem}
.scc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:1.1rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.scc:hover{border-color:var(--c1l);box-shadow:var(--shm)}
.scc .sct{width:100%;height:4px;position:absolute;top:0;left:0}
.scc h3{font-size:.9rem;font-weight:600;margin-bottom:.3rem}.scc p{font-size:.78rem;color:var(--tx2);margin-bottom:.65rem}
.scc-m{display:flex;gap:.4rem;flex-wrap:wrap}
.si{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:.9rem;margin-bottom:.5rem}
.si-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.5rem}
.si-n{font-weight:600;font-size:.86rem}.si-d{font-size:.74rem;color:var(--tx2);margin-top:.1rem}
.si-s{display:flex;align-items:center;gap:.75rem}
.si-s input[type="range"]{flex:1;-webkit-appearance:none;height:5px;border-radius:3px;background:var(--bd2);outline:none}
.si-s input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--c1);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.si-v{min-width:44px;text-align:center;font-weight:700;font-size:.95rem;padding:.15rem .35rem;border-radius:5px}
.rh{text-align:center;padding:1.25rem .75rem}
.rb{font-size:3.2rem;font-weight:800;line-height:1}
.rg{display:inline-block;padding:.3rem .9rem;border-radius:99px;font-size:.95rem;font-weight:700;margin-top:.4rem;margin-bottom:.4rem}
.sgl{list-style:none}.sgl li{padding:.55rem .75rem;border-radius:7px;margin-bottom:.35rem;font-size:.84rem;border-left:4px solid}
.sg-c{background:#fef2f2;border-color:var(--dg);color:#7f1d1d}
.sg-w{background:#fffbeb;border-color:var(--wn);color:#78350f}
.sg-s{background:#f0fdf4;border-color:var(--ok);color:#14532d}
.rc{display:flex;align-items:center;gap:.85rem;padding:.85rem 1.1rem;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);margin-bottom:.55rem;box-shadow:var(--sh);transition:box-shadow .15s}
.rc:hover{box-shadow:var(--shm)}
.rc-s{font-size:1.5rem;font-weight:800;min-width:45px;text-align:center}
.rc-i{flex:1}.rc-n{font-weight:600;font-size:.9rem}.rc-m{font-size:.76rem;color:var(--tx2);margin-top:.1rem}
.rc-a{display:flex;gap:.35rem}
.gb{display:flex;border-radius:6px;overflow:hidden;height:26px;margin:.4rem 0}
.gs{display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:600;color:#fff}
.mo{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.mo.show{display:flex}
.ml{background:var(--sf);border-radius:var(--rl);box-shadow:var(--shm);width:92%;max-width:600px;max-height:88vh;overflow-y:auto;padding:1.4rem}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem;font-size:1rem;font-weight:600}
.mc{background:none;border:none;font-size:1.15rem;cursor:pointer;color:var(--tx3);padding:.15rem}
.mf{display:flex;justify-content:flex-end;gap:.4rem;margin-top:1.1rem}
.ic{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem;border-radius:7px;border:1px solid var(--bd);margin-bottom:.35rem;cursor:pointer;transition:all .15s;background:var(--sf)}
.ic:hover{border-color:var(--c1l)}.ic.sel{border-color:var(--c1);background:var(--c1bg)}
.ic input[type="checkbox"]{width:15px;height:15px;accent-color:var(--c1);margin-top:2px;flex-shrink:0}
.ic-b{flex:1}.ic-n{font-weight:600;font-size:.82rem}.ic-d{font-size:.74rem;color:var(--tx2)}
.pkg-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.85rem}
.pkg-c{background:var(--sf);border:2px solid var(--bd);border-radius:var(--rl);padding:1.1rem;transition:all .2s}
.pkg-c:hover{border-color:var(--c1l)}.pkg-c.sel{border-color:var(--c1);background:var(--c1bg)}
.pkg-c h4{font-size:.88rem;font-weight:600;margin-bottom:.2rem}.pkg-c p{font-size:.76rem;color:var(--tx2);margin-bottom:.4rem}
.empty{text-align:center;padding:2rem;color:var(--tx3)}
.fb{display:flex;justify-content:space-between;align-items:center}
.tc{text-align:center}
.cg{color:var(--ok)}.cb{color:var(--in)}.ca{color:var(--wn)}.cr{color:var(--dg)}
</style>
</head>
<body>

<aside class="sidebar">
<div class="sb-brand"><h1>绿色低碳供应链<br>评估系统</h1><p>面向链主企业</p></div>
<nav class="sb-nav">
  <div class="sb-sec">总览</div>
  <div class="ni on" data-p="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>工作台</div>
  <div class="sb-sec">供应商</div>
  <div class="ni" data-p="suppliers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>供应商管理</div>
  <div class="sb-sec">评估配置</div>
  <div class="ni" data-p="scenarios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>情景模式</div>
  <div class="ni" data-p="indicators"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>指标管理</div>
  <div class="ni" data-p="packages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>指标包</div>
  <div class="ni" data-p="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>打分规则</div>
  <div class="sb-sec">评估执行</div>
  <div class="ni" data-p="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>评估方案<span class="nb" id="nb-plan" style="display:none">0</span></div>
  <div class="ni" data-p="execute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>执行评估</div>
  <div class="ni" data-p="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>评估记录</div>
  <div class="sb-sec">系统</div>
  <div class="ni" data-p="system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>系统管理</div>
</nav>
</aside>

<div class="main">
<div class="topbar"><div class="topbar-t" id="tt">工作台</div><div id="ta"></div></div>
<div class="ct">
  <div id="p-dashboard" class="page on"></div>
  <div id="p-suppliers" class="page"></div>
  <div id="p-scenarios" class="page"></div>
  <div id="p-indicators" class="page"></div>
  <div id="p-packages" class="page"></div>
  <div id="p-rules" class="page"></div>
  <div id="p-plans" class="page"></div>
  <div id="p-execute" class="page"></div>
  <div id="p-records" class="page"></div>
  <div id="p-system" class="page"></div>
</div>
</div>

<div class="mo" id="m-ind"><div class="ml"><div class="mh"><span id="mi-t">指标</span><button class="mc" onclick="cm('m-ind')">&times;</button></div><div id="mi-b"></div></div></div>
<div class="mo" id="m-pkg"><div class="ml"><div class="mh"><span id="mp-t">指标包</span><button class="mc" onclick="cm('m-pkg')">&times;</button></div><div id="mp-b"></div></div></div>
<div class="mo" id="m-rule"><div class="ml"><div class="mh"><span id="mr-t">规则</span><button class="mc" onclick="cm('m-rule')">&times;</button></div><div id="mr-b"></div></div></div>
<div class="mo" id="m-sc"><div class="ml" style="max-width:640px"><div class="mh"><span id="ms-t">情景</span><button class="mc" onclick="cm('m-sc')">&times;</button></div><div id="ms-b"></div></div></div>
<div class="mo" id="m-sup"><div class="ml"><div class="mh"><span id="mu-t">供应商</span><button class="mc" onclick="cm('m-sup')">&times;</button></div><div id="mu-b"></div></div></div>
<div class="mo" id="m-det"><div class="ml" style="max-width:700px"><div class="mh"><span>详情</span><button class="mc" onclick="cm('m-det')">&times;</button></div><div id="md-b"></div></div></div>

<script>
let D={};
let EX={step:1,sid:'',plan:{},pkgs:[],inds:[],scores:{},weights:{}};
let indF='全部',supF='all';
const PN={dashboard:'工作台',suppliers:'供应商管理',scenarios:'情景模式',indicators:'指标管理',packages:'指标包',rules:'打分规则',plans:'评估方案',execute:'执行评估',records:'评估记录',system:'系统管理'};
const A={
  g:u=>fetch(u).then(r=>r.json()),
  p:(u,d)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json()),
  u:(u,d)=>fetch(u,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json()),
  d:u=>fetch(u,{method:'DELETE'}).then(r=>r.json()),
};
async function LA(){
  const[a,b,c,d,e,f,g,h]=await Promise.all([A.g('/api/indicators'),A.g('/api/packages'),A.g('/api/rules'),A.g('/api/scenarios'),A.g('/api/suppliers'),A.g('/api/plans'),A.g('/api/records'),A.g('/api/statistics')]);
  D={indicators:a,packages:b,rules:c,scenarios:d,suppliers:e,plans:f,records:g,stats:h};
  const nb=document.getElementById('nb-plan');
  if(D.stats.pendingPlans>0){nb.style.display='';nb.textContent=D.stats.pendingPlans}else nb.style.display='none';
}
function nav(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
  document.getElementById('p-'+p).classList.add('on');
  document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('on',n.dataset.p===p));
  document.getElementById('tt').textContent=PN[p]||p;
  document.getElementById('ta').innerHTML='';
  ({dashboard:pgDash,suppliers:pgSup,scenarios:pgSc,indicators:pgInd,packages:pgPkg,rules:pgRule,plans:pgPlan,execute:pgExec,records:pgRec,system:pgSys})[p]?.();
}
document.querySelectorAll('.ni').forEach(n=>n.addEventListener('click',()=>nav(n.dataset.p)));
function cm(id){document.getElementById(id).classList.remove('show')}
function om(id){document.getElementById(id).classList.add('show')}
function gradeClass(s){return s>=90?'cg':s>=75?'cb':s>=60?'ca':'cr'}
function gradeBadge(s){return s>=90?'bg-g':s>=75?'bg-b':s>=60?'bg-a':'bg-r'}

// ━━ Dashboard ━━
async function pgDash(){
  await LA();const s=D.stats;
  document.getElementById('p-dashboard').innerHTML=`
  <div class="stats">
    <div class="stat"><b>${s.supplierCount}</b><small>供应商总数</small></div>
    <div class="stat"><b>${s.activeSuppliers}</b><small>活跃供应商</small></div>
    <div class="stat"><b>${s.ratedSuppliers}</b><small>已评级</small></div>
    <div class="stat"><b>${s.totalRecords}</b><small>评估次数</small></div>
    <div class="stat"><b>${s.avgScore||'-'}</b><small>平均得分</small></div>
    <div class="stat"><b>${s.passRate}%</b><small>通过率</small></div>
    <div class="stat"><b>${s.pendingPlans}</b><small>待评估</small></div>
    <div class="stat"><b>${s.indicatorCount}</b><small>指标数</small></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:.85rem">
    <div class="card"><div class="card-t">评估闭环流程</div>
      <div style="padding:.4rem 0">${[
        ['1','录入供应商','在供应商管理中添加供应商基本信息'],
        ['2','选择情景模式','根据评估目的选择预配置的评估场景'],
        ['3','创建评估方案','选择供应商，关联指标包与打分规则'],
        ['4','执行指标评分','对方案中的每项指标进行打分'],
        ['5','生成评估结果','自动计算得分、评级并生成改进建议'],
        ['6','更新供应商评级','评估结果自动回写供应商绿色评级'],
      ].map(([n,t,d])=>`<div style="display:flex;align-items:flex-start;gap:.65rem;margin-bottom:.75rem">

async function pgExec(){await LA();if(EX.step===3&&EX.plan.id){rExec();return}EX={step:1,sid:EX.sid||'',plan:{},pkgs:[],inds:[],scores:{},weights:{}};rExec()}
function rExec(){
  const s=EX.step;const steps=['选择情景','配置方案','指标评分','评估结果'];
  const el=document.getElementById('p-execute');
  let html=`<div class="wf">${steps.map((t,i)=>{const cl=(i+1)<s?'wdn':(i+1)===s?'wact':'';return `<div class="ws ${cl}"><span class="wn">${(i+1)<s?'&#10003;':i+1}</span>${t}</div>${i<steps.length-1?`<div class="wl ${(i+1)<s?'wdn':''}"></div>`:''}`}).join('')}</div>`;
  if(s===1) html+=rEx1();
  if(s===2) html+=rEx2();
  if(s===3) html+=rEx3();
  if(s===4) html+=`<div id="ex-r4"></div>`;
  el.innerHTML=html;
  if(s===2) updExPrev();
}

function rEx1(){
  const pkgM=Object.fromEntries(D.packages.map(p=>[p.id,p]));
  return `<div class="card"><div class="card-t">选择情景模式</div>
    <p style="color:var(--tx2);font-size:.82rem;margin-bottom:.85rem">选择一个预配置的评估情景，系统将自动加载对应的指标包和打分规则。</p>
    <div class="scg">${D.scenarios.map(sc=>{const pk=sc.packageIds.map(pid=>pkgM[pid]).filter(Boolean);const cnt=new Set(pk.flatMap(p=>p.indicatorIds)).size;const sel=EX.sid===sc.id;
      return `<div class="scc" style="${sel?'border-color:var(--c1);background:var(--c1bg)':''}" onclick="EX.sid='${sc.id}';rExec()"><div class="sct" style="background:${pk[0]?.color||'var(--c1)'}"></div><h3>${sc.name}</h3><p>${sc.description}</p>
      <div class="scc-m"><span class="badge bg-g">${sc.industry}</span><span class="badge bg-p">${cnt} 项指标</span></div></div>`}).join('')}</div>
    <div style="text-align:right;margin-top:.85rem"><button class="btn bp bl" onclick="goEx(2)">下一步：配置方案 →</button></div></div>`;
}

function rEx2(){
  const sc=D.scenarios.find(s=>s.id===EX.sid);
  if(!EX.pkgs.length&&sc)EX.pkgs=[...sc.packageIds];
  const iM=Object.fromEntries(D.indicators.map(i=>[i.id,i]));
  return `<div class="card"><div class="card-t">配置评估方案</div>
    <div class="fr"><div class="fg"><label>方案名称 *</label><input id="ex-nm" value="${sc?sc.name+' - '+new Date().toLocaleDateString('zh-CN'):''}"></div>
    <div class="fg"><label>选择供应商 *</label><select id="ex-sup"><option value="">-- 请选择供应商 --</option>${D.suppliers.filter(s=>s.status==='active').map(s=>`<option value="${s.id}">${s.name} (${s.code})</option>`).join('')}</select></div></div>
    <div class="fr"><div class="fg"><label>所属行业</label><input id="ex-ind" value="${sc?sc.industry:''}"></div>
    <div class="fg"><label>打分规则</label><select id="ex-rl">${D.rules.map(r=>`<option value="${r.id}" ${sc&&sc.ruleId===r.id?'selected':''}>${r.name}</option>`).join('')}</select></div></div>
    <div class="fg"><label>选择指标包</label><div class="pkg-g">${D.packages.map(pk=>{const sel=EX.pkgs.includes(pk.id);const inds=pk.indicatorIds.map(id=>iM[id]).filter(Boolean);
      return `<div class="pkg-c ${sel?'sel':''}" onclick="tgExPkg('${pk.id}')" style="cursor:pointer"><div style="display:flex;align-items:center;gap:.35rem;margin-bottom:.25rem"><div style="width:8px;height:8px;border-radius:50%;background:${pk.color}"></div><h4>${pk.name}</h4></div><p>${pk.description}</p><span class="badge bg-b">${inds.length} 项</span></div>`}).join('')}</div></div>
    <div style="background:var(--bg);border-radius:7px;padding:.65rem;margin-bottom:.85rem"><div style="font-weight:600;font-size:.82rem;margin-bottom:.3rem" id="ex-ic"></div><div id="ex-ip" style="font-size:.78rem;color:var(--tx2)"></div></div>
    <div class="fb"><button class="btn bg" onclick="goEx(1)">← 上一步</button><div><button class="btn bo" onclick="savePlanOnly()" style="margin-right:.4rem">仅保存方案</button><button class="btn bp bl" onclick="goEx(3)">下一步：开始评分 →</button></div></div></div>`;
}
function tgExPkg(pid){const i=EX.pkgs.indexOf(pid);if(i>=0)EX.pkgs.splice(i,1);else EX.pkgs.push(pid);rExec()}
function updExPrev(){
  const pkgM=Object.fromEntries(D.packages.map(p=>[p.id,p]));const iM=Object.fromEntries(D.indicators.map(i=>[i.id,i]));
  const ids=[...new Set(EX.pkgs.flatMap(pid=>(pkgM[pid]||{indicatorIds:[]}).indicatorIds))];EX.inds=ids;
  ids.forEach(id=>{if(!(id in EX.scores))EX.scores[id]=75;if(!(id in EX.weights))EX.weights[id]=1});
  document.getElementById('ex-ic').textContent=`将评估 ${ids.length} 项指标`;
  const cats={};ids.forEach(id=>{const ind=iM[id];if(ind){(cats[ind.category]=cats[ind.category]||[]).push(ind.name)}});
  document.getElementById('ex-ip').innerHTML=Object.entries(cats).map(([c,ns])=>`<strong>${c}：</strong>${ns.join('、')}`).join('<br>');
}
async function savePlanOnly(){const b=gatherPlan();if(!b)return;await A.p('/api/plans',b);await LA();alert('方案已保存');nav('plans')}
function gatherPlan(){
  const nm=document.getElementById('ex-nm').value.trim();const sid=document.getElementById('ex-sup').value;
  if(!sid){alert('请选择供应商');return null}
  return{name:nm,scenarioId:EX.sid,supplierId:sid,industry:document.getElementById('ex-ind').value.trim(),
    ruleId:document.getElementById('ex-rl').value,packageIds:EX.pkgs,weights:EX.weights};
}
function rEx3(){
  const iM=Object.fromEntries(D.indicators.map(i=>[i.id,i]));
  const inds=EX.inds.map(id=>iM[id]).filter(Boolean);
  const cats=['全部',...new Set(inds.map(i=>i.category))];
  const flt=scF==='全部'?inds:inds.filter(i=>i.category===scF);
  const rule=D.rules.find(r=>r.id===(EX.plan.ruleId||document.getElementById('ex-rl')?.value||'R01'));

  return `<div class="card"><div class="card-t">指标评分</div>
    <p style="color:var(--tx2);font-size:.82rem;margin-bottom:.65rem">${EX.plan.supplierName||''} · 共 ${inds.length} 项指标 · ${rule?rule.name:''}</p>

      ${wm==='weighted'?`<div style="display:flex;align-items:center;gap:.25rem;font-size:.76rem;color:var(--tx2)">权重 <input type="number" min="1" max="10" value="${w}" style="width:42px;padding:.18rem .25rem;border:1px solid var(--bd);border-radius:4px;font-size:.76rem;text-align:center" onchange="EX.weights['${ind.id}']=parseInt(this.value)||1"></div>`:''}</div>
      <div class="si-s"><input type="range" min="0" max="100" value="${sc}" oninput="uSc('${ind.id}',this.value)"><div class="si-v ${gradeClass(sc)}" id="sv-${ind.id}">${sc}</div></div>
      <div style="display:flex;justify-content:space-between;font-size:.66rem;color:var(--tx3);margin-top:.15rem"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div>`}).join('')}
    <div class="fb" style="margin-top:.85rem">
      ${EX.plan.id?`<button class="btn bg" onclick="nav('plans')">← 返回</button>`:`<button class="btn bg" onclick="goEx(2)">← 上一步</button>`}
      <button class="btn bp bl" onclick="submitEx()">提交评估</button></div></div>`;
}
function uSc(id,v){v=parseInt(v);EX.scores[id]=v;const el=document.getElementById('sv-'+id);el.textContent=v;el.className='si-v '+gradeClass(v)}
async function submitEx(){
  let pid=EX.plan.id;
  if(!pid){const b=gatherPlan();if(!b)return;const p=await A.p('/api/plans',b);pid=p.id;EX.plan=p}
  const rec=await A.p('/api/records',{planId:pid,scores:EX.scores});

function showResult(r){
  const iM=Object.fromEntries(D.indicators.map(i=>[i.id,i]));let ch='';
  for(const[cat,cd]of Object.entries(r.categoryDetail||{})){
    ch+=`<div style="margin-top:.85rem"><div style="font-weight:600;margin-bottom:.35rem">${cat} <span class="${gradeClass(cd.score)}" style="font-size:.82rem">(${cd.score}分 · ${cd.count}项)</span></div>`;
    for(const[iid,sc]of Object.entries(r.scores)){const ind=iM[iid];if(!ind||ind.category!==cat)continue;
      ch+=`<div style="display:flex;justify-content:space-between;padding:.3rem .6rem;background:var(--bg);border-radius:5px;margin-bottom:.2rem;font-size:.82rem"><span>${ind.name}</span><span class="badge ${gradeBadge(sc)}">${sc}分</span></div>`}

  document.getElementById('ex-r4').innerHTML=`<div class="card">

    <div class="card-t" style="margin-top:.75rem">分类得分明细</div>${ch}
    <div class="tc" style="margin-top:1.25rem"><button class="btn bp" onclick="EX={step:1,sid:'',plan:{},pkgs:[],inds:[],scores:{},weights:{}};nav('execute')">开始新评估</button>
    <button class="btn bo" onclick="nav('records')" style="margin-left:.4rem">查看记录</button>
    <button class="btn bo" onclick="nav('suppliers')" style="margin-left:.4rem">查看供应商</button></div></div>`;
}
function goEx(s){
  if(s===2&&!EX.sid){alert('请选择一个情景模式');return}
  if(s===3&&EX.step===2){
    if(!document.getElementById('ex-sup').value){alert('请选择供应商');return}
    if(!EX.pkgs.length){alert('请至少选择一个指标包');return}
